function buildCards(category, containerId) {
  const container = document.getElementById(containerId);
  if (!container) return;
  container.innerHTML = '';
  DATA[category].forEach(project => {
    if (!project.visible) return;
    if (!project.cover) return;
    const div = document.createElement('div');
    div.className = 'project-card';
    div.onclick = () => openLightbox(project.name, project.photos);
    div.innerHTML = `
      <img src="${project.cover}" alt="${project.name}" loading="lazy"/>
      <div class="overlay"></div>
      <div class="card-title">${project.name}</div>
    `;
    container.appendChild(div);
  });
  // Estructuras: flat grid (just photos, no sub-project cards)
  if (category === 'estructuras') {
    container.innerHTML = '';
    DATA.estructuras[0].photos.forEach(photo => {
      const div = document.createElement('div');
      div.className = 'project-card';
      div.onclick = () => openFullPhoto(photo);
      div.innerHTML = `<img src="${photo}" alt="estructura" loading="lazy"/><div class="overlay"></div>`;
      container.appendChild(div);
    });
  }
}

function openLightbox(name, photos) {
  if (!photos || photos.length === 0) return;
  document.getElementById('lb-title').textContent = name;
  const grid = document.getElementById('lb-grid');
  grid.innerHTML = photos.map(p =>
    `<div class="project-card" style="height:200px;" onclick="openFullPhoto('${p.replace(/'/g,"\\'")}')">
      <img src="${p}" alt="" loading="lazy"/>
      <div class="overlay"></div>
    </div>`
  ).join('');
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

function openFullPhoto(src) {
  document.getElementById('fullphoto-img').src = src;
  document.getElementById('fullphoto').classList.add('open');
}

function closeFullPhoto() {
  document.getElementById('fullphoto').classList.remove('open');
  document.getElementById('fullphoto-img').src = '';
}

function filterGallery(type) {
  const sections = ['steel','wood','tradicional','modulos','estructuras'];
  const btns = { all:'btn-all', steel:'btn-steel', wood:'btn-wood', tradicional:'btn-tradicional', modulos:'btn-modulos', estructuras:'btn-estructuras' };
  Object.values(btns).forEach(id => {
    const btn = document.getElementById(id);
    btn.style.backgroundColor = '';
    btn.style.color = '';
    btn.classList.remove('bg-primary','text-white');
    btn.classList.add('bg-surface-container-low','text-on-surface-variant');
  });
  const active = document.getElementById(btns[type]);
  active.classList.add('bg-primary','text-white');
  active.classList.remove('bg-surface-container-low','text-on-surface-variant');
  sections.forEach(s => {
    const section = document.getElementById('section-' + s);
    section.style.display = (type === 'all' || type === s) ? '' : 'none';
  });
}

// Build all cards on load
buildCards('steel', 'grid-steel');
buildCards('wood', 'grid-wood');
buildCards('tradicional', 'grid-tradicional');
buildCards('modulos', 'grid-modulos');
buildCards('estructuras', 'grid-estructuras');

// Keyboard: Escape closes modals
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeFullPhoto(); closeLightbox(); }
});
</script>
